name: Docs

# DOCS-001 (DEC-057): builds docs/ as an mdbook site and publishes it to
# GitHub Pages. Deliberately its own workflow, not a job added to test.yml —
# `dec_007_ci_scan` reads that file's `run:` lines against `.github/CONTRIBUTING.md`'s
# DEC-007 block, and a docs job in it would be read as (and fail as) a missing
# DEC-007 entry for a Rust test that doesn't exist.
#
# The build runs on every push and pull request, so a broken internal link is
# caught before it reaches `main`; only a push to `main` deploys. **The
# `pages` concurrency lock is on the deploy job alone** -- see its own
# comment: at workflow level, one deployment stuck in `waiting` stopped the
# link check on every later commit for three days.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so the site does not silently reformat on someone else's
  # unrelated push: both tools are installed at an exact version, not
  # "latest". Bumping either is a deliberate, reviewable change to these
  # two lines. Kept beside `docs/book.toml`'s own comment on why the
  # renderer command differs from the crate name.
  MDBOOK_VERSION: "0.5.4"
  MDBOOK_LINKCHECK2_VERSION: "0.13.0"

jobs:
  build:
    name: mdbook build (with link check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      # `baptiste0928/cargo-install` caches the compiled binary keyed on
      # crate name + version, so a pinned version only ever compiles once
      # per runner image rather than on every run.
      - uses: baptiste0928/cargo-install@v3
        with:
          crate: mdbook
          version: ${{ env.MDBOOK_VERSION }}
      - uses: baptiste0928/cargo-install@v3
        with:
          crate: mdbook-linkcheck2
          version: ${{ env.MDBOOK_LINKCHECK2_VERSION }}

      # Fails the job on a broken internal link -- a relative link to a
      # missing page, a missing heading anchor, or (see `docs/book.toml`'s
      # comment) a relative link to a real file that `SUMMARY.md` doesn't
      # list. Does NOT check external (`https://…`) URLs: `follow-web-links`
      # is off in `book.toml`, so this build never depends on another site
      # being reachable.
      - name: mdbook build
        run: mdbook build docs

      - if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/book/html

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    # The `pages` lock lives on this job, not on the workflow, since
    # 2026-11-21. Only one Pages deployment may be in flight at a time;
    # **building the book and checking its links has no such
    # constraint**, and holding the lock at workflow level meant one
    # stuck deployment stopped the checking too.
    #
    # It did. Run 44281512009 (head `9202290`, 2026-11-18T10:05:12Z)
    # reached `status: waiting` on the `github-pages` environment and
    # never left it: its own `mdbook build (with link check)` job had
    # already passed, and the deployment simply never advanced to
    # `queued`. With the lock at workflow level, every later commit's
    # whole run queued behind it -- so for three days no push's links
    # were checked by anything, while `CI` stayed green and said
    # nothing about it. GitHub refused to clear the run by every route
    # available, with three answers that contradict each other:
    # `cancel` said "run is completed", `force-cancel` said "has not
    # been queued yet", and a deployment rejection said "no pending
    # deployment requests". It may sit there indefinitely.
    #
    # So the lock moves to the step that actually needs it. A wedged
    # deployment now costs the deployment and nothing else, and the
    # gate keeps running. `cancel-in-progress` stays `false`: a Pages
    # deploy is not safe to interrupt, and GitHub keeps only the newest
    # *pending* run per group anyway, which is the supersession already
    # observed on every commit behind the wedge.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
