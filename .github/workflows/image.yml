name: Image

# FIV-003 (RFC 017 proposal 2): a container image on `ghcr.io`, built
# and published after the Release already exists -- never gating it
# (DEC-056 stays four legs; same reasoning as FIV-002's archives).
#
# Its own workflow file, not a job in test.yml, same reason as
# docs.yml and release.yml: dec_007_ci_scan reads only test.yml's
# `run:` lines against CONTRIBUTING.md's DEC-007 block.
#
# No third-party action anywhere in this file (FIV-002 round 2's own
# ruling, carried over here rather than relearned): GitHub-hosted
# runners already carry Docker, so `docker build`/`run`/`push` in
# plain `run:` steps need no `docker/build-push-action` or
# `docker/login-action` -- this is also the one workflow with
# `packages: write`.
#
# workflow_dispatch builds and walks the image -- register, create a
# project, recreate the container on the same volume, confirm the
# session still works -- without ever logging in to ghcr.io or pushing
# anything, same shape as release.yml's own test path.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Branch, tag, or commit to build. Never publishes to ghcr.io
          regardless of this value.
        required: true
        default: main

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/nabbisen/peisear
  COOKIE_JAR: /tmp/peisear-image-walk-cookies.txt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}

      # Same check, same reason as release.yml's own (FIV-002 round 2
      # §9): Cargo.toml's version and the triggering tag agree at
      # exactly one commit per release and disagree the rest of the
      # time, and nothing else here would notice.
      - name: Verify Cargo.toml's version matches the release tag
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag="${{ github.event.release.tag_name }}"
          tag_version="${tag#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Cargo.toml's version ($cargo_version) does not match the release tag ($tag) -- refusing to publish an image tagged for the wrong version."
            exit 1
          fi

      - name: Build image
        run: docker build -f infra/docker/Dockerfile -t peisear:walk .

      - name: Image size and user (FIV-003 §5/§7, stated not thresholded)
        run: |
          docker image inspect peisear:walk --format='image size: {{.Size}} bytes'
          docker image inspect peisear:walk --format='runs as: {{.Config.User}}'

      - name: Walk it -- register, create a project
        run: |
          set -euo pipefail
          mkdir -p "$PWD/data"
          docker run -d --name peisear-a -p 3000:3000 -v "$PWD/data:/data" peisear:walk
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health > /dev/null && break; sleep 1; done
          curl -sf http://localhost:3000/health
          code=$(curl -s -o /dev/null -w '%{http_code}' -c "$COOKIE_JAR" \
            --data-urlencode "email=walk@example.com" \
            --data-urlencode "password=a-real-walk-password-123" \
            --data-urlencode "display_name=Walk" \
            http://localhost:3000/register)
          echo "register: $code"
          [ "$code" = "303" ] || { echo "::error::register did not redirect (303), got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE_JAR" http://localhost:3000/projects)
          echo "authenticated /projects: $code"
          [ "$code" = "200" ] || { echo "::error::session from register did not authenticate, got $code"; exit 1; }
          docker logs peisear-a
          docker stop peisear-a
          docker rm peisear-a

      # FIV-003 §1: the database and FIV-001's generated key live in
      # the same volume. If the volume did not actually persist the
      # key file (wrong path, a permission the non-root user couldn't
      # write), the second container would silently generate a
      # *different* key, and the first container's own cookie would
      # stop validating -- the exact, discriminating failure this
      # walk is built to catch, not merely "the second container also
      # starts".
      - name: Volume persistence -- recreate the container, same volume, same session
        run: |
          set -euo pipefail
          docker run -d --name peisear-b -p 3000:3000 -v "$PWD/data:/data" peisear:walk
          for i in $(seq 1 30); do curl -sf http://localhost:3000/health > /dev/null && break; sleep 1; done
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$COOKIE_JAR" http://localhost:3000/projects)
          echo "authenticated /projects after recreation, same cookie: $code"
          [ "$code" = "200" ] || { echo "::error::session did not survive container recreation on the same volume"; exit 1; }
          docker logs peisear-b
          docker stop peisear-b
          docker rm peisear-b

      - name: Publish to ghcr.io
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag peisear:walk "$IMAGE:${{ github.event.release.tag_name }}"
          docker tag peisear:walk "$IMAGE:latest"
          docker push "$IMAGE:${{ github.event.release.tag_name }}"
          docker push "$IMAGE:latest"
