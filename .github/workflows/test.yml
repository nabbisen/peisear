  # The §1.7 vocabulary guard (I18N-001, RFC 006 open question 3's
  # default). Blocking from 0.21.0 -- an advisory guard on a P0
  # requirement is a guard nobody fixes.
  test-peisear-i18n:
    name: peisear-i18n (vocabulary guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p peisear-i18n

  test-peisear-notify:
    name: peisear-notify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p peisear-notify -- --test-threads=1

  # Library-only test runs for crates without integration tests
  # currently. Cheap; catches doctests and unit tests as those land.
  test-libs:
    name: peisear-core / peisear-auth / peisear-storage (lib tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p peisear-core --lib
      - run: cargo test -p peisear-auth --lib
      - run: cargo test -p peisear-storage --lib

  build:
    name: cargo build (release-lite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  # Exercises the declared MSRV (Cargo.toml's rust-version) so drift
  # is caught the day it happens rather than months later (DEV-005
  # item A, RSK-002, NFR-CMP-001 -- this is how ISSUE-004 came about).
  # Build only, on the MSRV itself -- fmt/clippy run on the pinned
  # rust-toolchain.toml version (1.97.1) above, not on the MSRV floor.
  msrv:
    name: cargo build (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
