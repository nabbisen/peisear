name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Cap codegen units to keep linker memory in check on the
  # default GitHub runner (7 GB RAM). The peisear-web test build
  # in particular has been observed to OOM with the rustc
  # default of 256.
  CARGO_PROFILE_DEV_CODEGEN_UNITS: 16
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # DOCS-002: the published API docs (seven crates go to crates.io;
  # docs.rs builds this). `clippy` above doesn't check doc links and
  # nothing else did either, which is how this backlog went unnoticed.
  #
  # `--keep-going` is required, not optional: without it cargo stops
  # scheduling crates after the first failure, so a run can silently
  # never reach `peisear-web` and report a false clean. That is
  # exactly how this gate's own pre-fix count came in short.
  #
  # `rustdoc::private_intra_doc_links` stays un-denied, permanently,
  # not pending: eight public doc comments deliberately cross-reference
  # private implementation-detail items (a SQL CTE constant, private
  # validation/parse helpers, the i18n `t` helper) purely for a reader
  # already in the source. None should become public API on its own.
  # Denying this lint would make the build red on purpose for all
  # eight.
  rustdoc-links:
    name: cargo doc (broken link check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps --keep-going
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links

  # BROWSER-001 (RFC 011 step 4): the horizontal-overflow gate. One
  # assertion -- scrollWidth <= clientWidth -- on twenty-four rendered
  # pages at five widths (LAYOUT-005, BROWSER-002, LAYOUT-008, GATE-002,
  # GATE-003, SPRINT-005), driven by
  # browser-checks/cdp.mjs (no npm dependency; Chromium is already
  # present on ubuntu-latest). This is a gate on the same footing as
  # fmt/clippy above, deliberately
  # NOT a Rust test: see browser-checks/README.md for why it doesn't
  # run inside cargo test --workspace, and for DEC-048 condition 3's
  # own quarantine policy if this job ever needs one. No retry step
  # here, and none should be added without an issue link in that
  # README first.
  #
  # `DM-TEST-002` §2: this job also runs `undo-mousedown-trap.mjs`
  # (`DM-TEST-001` item 6), reusing this job's own `cargo build -p
  # peisear` and its already-present Chromium rather than paying for
  # both again in a second job. **One job may hold two gates; one gate
  # holds one assertion** -- `DEC-048` condition 3's "one assertion
  # only, do not widen this gate" governs `overflow-gate.mjs`'s own
  # assertion set, not what else runs in this job. Keeping the trap
  # script unwired was rejected: a script sitting unrun beside a gated
  # one reads as coverage, which is `§10.15`'s class arriving as a test
  # executed by nothing.
  #
  # `GATE-006` (`NFR-A11Y-008`, `§10.35`): a third gate, same reasoning
  # -- `drag-outcome-gate.mjs` is its own script, not a widening of
  # either of the other two, even though `DEC-048` condition 3's letter
  # names only `overflow-gate.mjs`. Three properties on the two
  # surfaces `GATE-005` measured as actually untested (`calendar.js`,
  # `plan.js`): the live region receives the outcome text, the undo
  # toast's Tab order, and the drop's stored effect read back over
  # HTTP. Port `4175`, its own scratch server and database, independent
  # of the other two.
  browser-overflow-gate:
    name: browser checks (overflow gate + undo mousedown trap + drag outcome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p peisear
      - run: node browser-checks/overflow-gate.mjs
      - run: node browser-checks/undo-mousedown-trap.mjs
      - run: node browser-checks/drag-outcome-gate.mjs

  # NFR-REL-011: README.md's third install path (`cargo install
  # peisear`) exercised end to end by CI, on the artefact that path
  # actually delivers -- installed to a scratch root, then run from a
  # directory outside the checkout, reaching an authenticated session.
  # `FIV-005`'s own manual walk (install, confirm the assets serve) is
  # the precedent; this is that walk as a job that runs on every push
  # and PR, not a recollection of one performed once by hand. `$RUNNER_
  # TEMP` is GitHub's own documented scratch directory outside
  # `$GITHUB_WORKSPACE` -- running from there, not from a subdirectory
  # of the checkout, is what makes this "outside the repository" and
  # not merely "a different folder inside it."
  test-install-walk:
    name: cargo install walk (NFR-REL-011)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo install --path, to a scratch root
        run: cargo install --path crates/peisear --root "$HOME/install-walk"
      - name: Walk it -- run from outside the repository, register, create a project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/install-walk-run"
          cd "$RUNNER_TEMP/install-walk-run"
          "$HOME/install-walk/bin/peisear" > peisear-walk.log 2>&1 &
          pid=$!
          trap 'cat peisear-walk.log; kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/health
          cookie_jar=cookies.txt
          code=$(curl -s -o /dev/null -w '%{http_code}' -c "$cookie_jar" \
            --data-urlencode "email=walk@example.com" \
            --data-urlencode "password=a-real-walk-password-123" \
            --data-urlencode "display_name=Walk" \
            http://127.0.0.1:3000/register)
          echo "register: $code"
          [ "$code" = "303" ] || { echo "::error::register did not redirect (303), got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$cookie_jar" http://127.0.0.1:3000/projects)
          echo "authenticated /projects: $code"
          [ "$code" = "200" ] || { echo "::error::session from register did not authenticate, got $code"; exit 1; }

  # `FIV-007` / `§10.44`: the one command that builds every crate from
  # its own package rather than from the workspace. `cargo build`,
  # `cargo test`, `clippy`, `rustdoc` above all compile in place, where
  # a path dependency reaching outside its crate directory (`static/`
  # used to be two levels above `peisear-web`'s own manifest) resolves
  # fine and the defect is invisible. `cargo package` extracts each
  # crate to its own isolated directory and compiles *that* -- the
  # same thing `cargo publish` does before uploading, and the only
  # thing in this project that does. `DEC-056` leg 3 is where this
  # first ran for real, after `0.53.0`'s own tag was already pushed;
  # this job exists so the next regression of this shape is caught on
  # a pull request, not after a tag.
  #
  # `--workspace`, not one crate at a time: a crate verified alone
  # resolves its sibling path dependencies from whatever is already
  # published on crates.io, which lags the workspace -- `peisear-web`
  # alone would have pulled `peisear-auth` 0.52.0, missing the
  # `generate_signing_key` function `FIV-001` only added in 0.53.0, and
  # failed for a second, unrelated reason. `--workspace` builds the
  # crates being verified against each other, in dependency order, the
  # way a real `cargo publish --workspace` run does.
  publish-dry-run:
    name: cargo publish --workspace --dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --workspace --dry-run

  # Build and test each test target individually rather than running
  # `cargo test --workspace` in one go. The combined build links many
  # large crates (sqlx + leptos + axum + wasm-smtp family) and has
  # been observed to peak above the GitHub runner's RAM limit during
  # the linker step. Splitting per test crate keeps each link step
  # under the cap and also produces clearer failure attribution.
  test-peisear-web-updated-at-authority:
    name: peisear-web / updated_at_authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p peisear-web --test updated_at_authority -- --test-threads=1

