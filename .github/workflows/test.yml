  # `QA-005`: every structural guard this project has built --
  # prose_scan, static_js_scan, test_harness_scan, dec_007_scan --
  # lives in this one target, and nothing above runs it. Named for
  # what breaks a reader would need to know, not just what command
  # ran: the four guards are the reason this job exists.
  test-peisear-web-lib:
    name: peisear-web / lib (structural guards)
    runs-on: ubuntu-latest
    steps:
      # `fetch-depth: 0`, not the default shallow clone: `changelog_scan`'s
      # own rule 7 (`REL-0.55.0` round 2) reads every release tag via
      # `git tag --list`, and a shallow checkout carries none of them --
      # found the hard way, by this exact job failing on a planted
      # defect that `released_versions` could not see, not by foresight.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p peisear-web --lib

  # The §1.7 vocabulary guard (I18N-001, RFC 006 open question 3's
  # default). Blocking from 0.21.0 -- an advisory guard on a P0
  # requirement is a guard nobody fixes.
  test-peisear-i18n:
