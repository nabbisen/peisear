  # Library-only test runs for crates without integration tests
  # currently. Cheap; catches doctests and unit tests as those land.
  # `QA-005`: the facade's own run is bare, no `--lib` -- its one test
  # is a doctest on `crates/peisear/src/lib.rs`, and `--lib` reports
  # zero for it (`QA-004`).
  test-libs:
    name: peisear-core / peisear-auth / peisear-storage / peisear (lib tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p peisear-core --lib
      - run: cargo test -p peisear-auth --lib
      - run: cargo test -p peisear-storage --lib
      - run: cargo test -p peisear

  # `PG-001`, `RFC 018` P3's first round: nothing in this series can be
  # proved without a real server, so the service arrives here rather
  # than at P4's conformance suite. One job, `postgres` feature only --
  # the `sqlite` suite above is untouched and still the default.
  # `postgres:17` is the current stable release; no PostgreSQL version
  # is pinned anywhere else in this project, and `RFC 018`'s own
  # reasoning (server stability and security first, not a scale claim)
  # gives no reason to pick an older one.
  test-postgres-connection:
    name: peisear-storage (postgres feature, real server)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peisear_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/peisear_ci
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `CON-002` (`RFC 018` P4): the whole `--lib` suite, unfiltered --
      # a name filter that matches nothing exits 0 (measured: `cargo
      # test -p peisear-storage --lib a-name-that-does-not-exist` ->
      # "0 passed; 0 failed", exit 0), so the four lines this replaces
      # could not tell green from examined nothing the day any of
      # their names moved. 46 tests compile and run here -- two fewer
      # than the 48 that compile, `pool::tests`' own SQLite-specific
      # pair (`sqlite_stat1`/the whole-second-vs-millisecond timestamp
      # duality, neither of which exists on this backend) stays
      # `#[cfg(feature = "sqlite")]`-gated, named in their own doc
      # comments rather than silently excluded.
      - run: "cargo test -p peisear-storage --no-default-features --features postgres --lib -- --test-threads=1"
      # `CON-003` (`RFC 018` P4): the lock half of "the same storage
      # **and lock** tests against both backends" -- the storage half
      # is the `--lib` line above, from `CON-002`. These three files
      # are the ones that, measured, actually are lock tests
      # (`CON-003` §1); the other ~30 files in `peisear-web/tests/`
      # are out of scope and untouched here. **Three explicit `--test
      # <target>` selectors, not a name filter** -- `CON-002`'s own
      # `§10.46` is the reason: a selector that names nothing exits 0,
      # and `cargo test --test <file-that-does-not-exist>` exits 101,
      # so a typo or a renamed file fails loudly here rather than
      # silently reading as "examined nothing, so green."
      # `optimistic_lock_guards`'s own PostgreSQL tests (inside the
      # `--lib` line above) share this round's isolation mechanism
      # too -- see `peisear-storage::pool::TestDatabase`.
      #
      # Three separate steps, not one `cargo test` call naming all
      # three `--test` targets: `cargo test` stops after the first
      # target that fails (no `--no-fail-fast` here, deliberately --
      # this job's every other line already relies on fail-fast to
      # stop the job promptly), so one target's failure would have
      # silently skipped the other two rather than reporting them.
      # Found by running it the other way first and measuring exactly
      # that: only `board_card_lock_value` ran at all.
      - run: "cargo test -p peisear-web --no-default-features --features postgres --test optimistic_lock -- --test-threads=1"
      - run: "cargo test -p peisear-web --no-default-features --features postgres --test optimistic_lock_atomicity -- --test-threads=1"
      - run: "cargo test -p peisear-web --no-default-features --features postgres --test board_card_lock_value -- --test-threads=1"
      # `CON-001` (`RFC 018` P4): the one real benefit an install walk
      # would have given, without documenting an install path -- build
      # `peisear` with the passthrough and boot it against this job's
      # own service container. Not a test in the per-crate DEC-007
      # block (this job already carries real-server steps outside it);
      # a CI step proving the first real start of peisear on
      # PostgreSQL, nothing more claimed.
      - name: cargo build -p peisear --no-default-features --features postgres
        run: cargo build -p peisear --no-default-features --features postgres
      - name: Boot smoke -- start against the service container, hit /health, stop
        run: |
          set -euo pipefail
          export JWT_SECRET="ci-postgres-boot-smoke-not-a-real-secret-$(date +%s)"
          ./target/debug/peisear > peisear-boot-smoke.log 2>&1 &
          pid=$!
          trap 'cat peisear-boot-smoke.log; kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/health
      # `CON-004` (`RFC 018` P4): `docs/operations/backup.md`'s own
      # PostgreSQL section documents a pg_dump/psql/pg_restore round
      # trip -- an untested command in an operations document is the
      # same defect class as a documented install path nobody walked
      # (`§10.41`). Proves the exact commands that document names, not
      # a paraphrase of them, against this job's own service
      # container. A scratch database of its own (`backup_doc_check*`),
      # not `peisear_ci` -- this has nothing to do with this crate's
      # own schema and should not depend on, or disturb, whatever state
      # the steps above left there.
      - name: Install a pg_dump/pg_restore matching the service container's own major version
        # Measured: the runner's own default `postgresql-client` is
        # 16.x; this job's service container is `postgres:17` (above),
        # and `pg_dump` refuses to dump from a newer server than its
        # own version -- "aborting because of server version mismatch"
        # -- a real check, not a CI quirk, and the reason this step
        # exists rather than assuming whatever ships on the runner
        # matches whatever this job pins as a service. The runner's
        # own default apt sources carry no `-17` package at all
        # (measured: `apt-get install postgresql-client-17` ->
        # "Unable to locate package" before this step added the PGDG
        # repository), so the official repository is added first, the
        # same way <https://www.postgresql.org/download/linux/ubuntu/>
        # documents.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-17
      - name: backup.md's own PostgreSQL commands, proved against a real server
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          export PGPASSWORD=postgres
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS backup_doc_check"
          psql -h localhost -U postgres -d postgres -c "CREATE DATABASE backup_doc_check"
          DATABASE_URL="postgres://postgres:postgres@localhost:5432/backup_doc_check"
          psql "$DATABASE_URL" -c "CREATE TABLE t (id int); INSERT INTO t VALUES (42);"
          pg_dump "$DATABASE_URL" --format=custom --file="peisear-$(date +%F).dump"
          psql -h localhost -U postgres -d postgres -c "DROP DATABASE IF EXISTS peisear_restored"
          psql "$DATABASE_URL" -c "CREATE DATABASE peisear_restored"
          pg_restore --dbname "${DATABASE_URL%/*}/peisear_restored" "peisear-$(date +%F).dump"
          result=$(psql --dbname "${DATABASE_URL%/*}/peisear_restored" -t -c "SELECT id FROM t")
          echo "restored row: $result"
          [ "$(echo "$result" | tr -d '[:space:]')" = "42" ] || { echo "::error::restored row did not read back 42"; exit 1; }

  build:
    name: cargo build (release-lite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace

  # Exercises the declared MSRV (Cargo.toml's rust-version) so drift
  # is caught the day it happens rather than months later (DEV-005
  # item A, RSK-002, NFR-CMP-001 -- this is how ISSUE-004 came about).
  # Build only, on the MSRV itself -- fmt/clippy run on the pinned
  # rust-toolchain.toml version (1.97.1) above, not on the MSRV floor.
  msrv:
    name: cargo build (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
