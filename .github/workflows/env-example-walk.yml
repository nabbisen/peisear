name: Env Example Walk

# REL-0.53.0 §5: the one walk nobody here can perform by reading the
# file. This job never reads `.env.example` either: it copies it, as
# the documented path instructs, and asserts on whether the server
# then runs -- the job's own log is the entire answer, never a tool
# here opening the file.
#
# Round 2 (0.53.0): this used to `echo` either outcome and always
# exit 0, deliberately, because a refusal was the correct answer while
# `.env.example` still shipped the published placeholder. The owner
# fixed the file (every variable now commented out at its own built-in
# default) and the walk confirmed it starts (run 38974525616, quoted
# in `requirements.md`'s `§10.40`). **A refusal now would be a real
# regression**, so this asserts: non-zero exit if the documented path
# does not reach a listening server.
#
# No third-party action (the same convention `release.yml`/`image.yml`
# adopted, `FIV-002` round 2 -- revisited here after the review named
# it unrevisited rather than left on the lower-risk-so-it's-fine
# reasoning this file carried for three days): bare `rustup install`
# resolves `rust-toolchain.toml`'s pin, same as everywhere else.
#
# `WLK-001`: `workflow_dispatch` alone meant this never ran on its own
# -- three dispatches in its whole life, the last 2026-10-16, before
# four releases shipped. `push`, scoped to the paths that can actually
# break it, runs it exactly when its own inputs change and costs
# nothing on every other push. This does not widen `NFR-REL-011`:
# that entry's own `0.53.0` round 2 decision excluded this reader
# deliberately, and this job already "stands on its own merit as a
# regression guard for the contributor path" (that entry's own words)
# -- a `push` trigger does not place it under that entry's authority,
# only under its own.
#
# The path list, each verified against what actually governs this
# walk's own outcome rather than assumed:
#   - `.env.example` itself -- the file the walk copies.
#   - `crates/peisear-web/src/config.rs` -- `Config::from_env` and the
#     `BIND_ADDR`/`DATABASE_URL`/`JWT_SECRET`/`COOKIE_SECURE`
#     resolvers .env.example's own commented-out defaults exercise.
#   - `crates/peisear/src/main.rs` -- added beyond the handoff's own
#     suggested list: `build_env_filter` (`RUST_LOG`'s resolver) lives
#     here, not in `config.rs`, and a regression that turned an unset
#     `RUST_LOG` from a default into a refusal would break this walk
#     exactly like a `config.rs` regression would.
#   - `docs/getting-started/build-from-source.md` and
#     `.github/CONTRIBUTING.md` -- the two documents that now publish
#     `cp .env.example .env` (`QS-003` made it two, from one).
#   - this file.
# Not included, considered and dropped: `crates/peisear-notify/src/
# config.rs` -- `.env.example` leaves every `SMTP_*` variable unset,
# and `RFC 022` §3's own rule makes that absence degrade (a warning,
# not a refusal) rather than block startup, so a regression there
# cannot fail this walk the way the others can.
#
# No `branches:` filter, unlike `test.yml`'s own `push`, deliberately:
# this fires on a push to any branch that touches the paths above, not
# only `main` -- a contributor's own branch gets the same regression
# signal a PR's checks already give before it merges, and `main` gets
# it again on the squash commit, each run's own event still `push`.
on:
  push:
    paths:
      - .env.example
      - crates/peisear-web/src/config.rs
      - crates/peisear/src/main.rs
      - docs/getting-started/build-from-source.md
      - .github/CONTRIBUTING.md
      - .github/workflows/env-example-walk.yml
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to walk.
        required: true
        default: main

permissions:
  contents: read

jobs:
  walk:
    runs-on: ubuntu-latest
    steps:
      # `inputs.ref` only exists on `workflow_dispatch` -- on `push`
      # the `inputs` context is empty, so this falls back to
      # `github.sha`, the commit that triggered the run, rather than
      # passing `actions/checkout` an empty string.
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install the toolchain
        run: rustup install

      # The exact two commands `docs/getting-started/configuration.md`
      # and `.github/CONTRIBUTING.md` both document.
      - name: cp .env.example .env, then cargo run --release -p peisear
        run: |
          set -euo pipefail
          cp .env.example .env
          cargo build --release -p peisear
          ./target/release/peisear > peisear-walk.log 2>&1 &
          pid=$!
          started=0
          for i in $(seq 1 15); do
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            if curl -sf http://127.0.0.1:3000/health > /dev/null 2>&1; then
              started=1
              break
            fi
            sleep 1
          done
          if [ "$started" = "1" ]; then
            echo "RESULT: started"
            kill "$pid" 2>/dev/null || true
          else
            echo "RESULT: did not start"
          fi
          echo "--- peisear-walk.log (the running binary's own stdout/stderr; .env's content is never printed by this job) ---"
          cat peisear-walk.log
          if [ "$started" != "1" ]; then
            echo "::error::the documented 'cp .env.example .env' path did not reach a listening server -- see the log above"
            exit 1
          fi
