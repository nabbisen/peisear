name: Release

# FIV-002 (RFC 017 proposal 1): a per-platform archive on each GitHub
# Release, attached after the Release already exists -- never gating
# it. DEC-056 stays four legs; this is not a fifth one the architect
# runs, it runs itself, on the `release: published` event the owner's
# own `gh release create` (or the UI) fires. A failed matrix entry
# leaves that Release with one fewer asset -- exactly today's state
# for all five -- and is fixed by re-running that one job, not by
# re-cutting the release.
#
# Deliberately its own workflow file, not a job added to test.yml --
# same reason as docs.yml (see that file's own comment):
# `dec_007_ci_scan` reads only test.yml's `run:` lines against
# `.github/CONTRIBUTING.md`'s DEC-007 block, and a `cargo build
# --release --target ...` line living there would read as an
# untracked DEC-007 obligation it isn't.
#
# Every target below builds natively, on a GitHub-hosted runner whose
# own OS and architecture already match it -- no cross-compilation, no
# third-party action or container (FIV-002 §7's own escalation
# condition). GitHub's Linux arm64 runners (ubuntu-24.04-arm) have
# been generally available for public repositories since 2025-08-07,
# and macOS ships both an Apple Silicon (macos-latest) and an Intel
# (macos-15-intel) hosted image -- that combination covers all five
# targets without reaching for `cross` or a Docker container.
#
# No third-party action anywhere in this file either (FIV-002 round 2
# §10): `dtolnay/rust-toolchain` and `Swatinem/rust-cache` were here
# in round 1 and are not now. GitHub's own hosted images already ship
# a working rustup toolchain, so `rustup target add` in a plain `run:`
# step does what the first did -- measured against all five runners,
# including the arm64 Linux image specifically, not assumed from the
# images' changelog. The build-time saving the second offered is a
# supply-chain dependency, at a moving ref, in the one workflow that
# holds `contents: write` and writes to what the public downloads --
# the more expensive side of that trade on a workflow that runs a
# handful of times a release, by this project's own standing
# preference for fewer dependencies over convenience ones.
#
# NFR-REL-002: files at the archive root, no intermediate directory.
# Each packaging step copies the binary alone into a scratch `dist/`
# directory, then archives with `tar`'s own `-C dist` (changes
# directory before adding `peisear`, so the path recorded in the
# tarball is just `peisear`, not `dist/peisear`) or by pointing
# `Compress-Archive` straight at the file inside `dist/` rather than
# at the directory -- either way, `dist` itself never becomes an
# entry in the archive.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          Branch, tag, or commit to build. workflow_dispatch never
          uploads to any Release regardless of this value -- it only
          produces the five archives as workflow artifacts, per
          FIV-002 §3.
        required: true
        default: main

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || '' }}

      # FIV-002 round 2 §9: on a real release, Cargo.toml's version and
      # the tag that triggered this run are two sources of truth that
      # agree at exactly one commit per release (the one the version
      # bump happens on) and disagree the rest of the time -- nothing
      # upstream of this step checks which one is being built. Runs
      # before the build, not after, so a mismatch costs a grep, not a
      # matrix's worth of compile time. Strips one leading "v" from the
      # tag, if present -- this project's own tags carry none (`0.52.0`,
      # not `v0.52.0`), so the strip is a no-op here, but the comparison
      # accepts either spelling rather than silently failing a
      # correctly-versioned tag that happens to use the other one.
      - name: Verify Cargo.toml's version matches the release tag
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          cargo_version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag="${{ github.event.release.tag_name }}"
          tag_version="${tag#v}"
          if [ "$cargo_version" != "$tag_version" ]; then
            echo "::error::Cargo.toml's version ($cargo_version) does not match the release tag ($tag) -- refusing to attach an archive named for the wrong version."
            exit 1
          fi

      # Measured against two real runs before this line reached its
      # current form. First: none of the five runners had an active
      # toolchain selected, so `rustup target add` alone fell through
      # to an undocumented auto-install rustup itself warns is
      # deprecated (rust-lang/rustup#4836). Second: `rustup install
      # stable` "fixed" that for the wrong toolchain -- this
      # repository's own `rust-toolchain.toml` pins `1.97.1`, which
      # `rustup target add` resolves to once it is run inside the
      # checked-out tree, so installing `stable` (1.99.0 at measurement
      # time) left `1.97.1` still unresolved and the same warning fired
      # for it instead. Bare `rustup install`, with no channel named,
      # installs whatever `rust-toolchain.toml` specifies -- the same
      # pinned version `test.yml`'s fmt/clippy jobs already build
      # against, so the release binary is built with the toolchain this
      # project actually targets, not merely "whatever stable is".
      - name: Install the toolchain and target
        run: |
          rustup install
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p peisear

      # The version lives in Cargo.toml, not the triggering ref --
      # workflow_dispatch can target a branch with no version-shaped
      # name at all (FIV-002 §3's own "0.52.0's commit" walk is a
      # branch, not a tag), so the archive name has to come from the
      # one place ROADMAP.md and NFR-REL-002 both already treat as
      # authoritative for it.
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          name="peisear-${version}-${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/peisear" dist/peisear
          tar czf "${name}.tar.gz" -C dist peisear
          echo "ARCHIVE_NAME=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version' | Select-Object -First 1).Line -replace '.*"([^"]+)".*','$1'
          $name = "peisear-$version-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/peisear.exe" "dist/peisear.exe"
          Compress-Archive -Path "dist/peisear.exe" -DestinationPath "$name.zip" -Force
          echo "ARCHIVE_NAME=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # NFR-REL-011: the archive this job just built, extracted and run
      # from a scratch directory, reaching an authenticated session --
      # same shape as `image.yml`'s own "Walk it" step, not gated on
      # `release.published` so it runs on every dispatch too. All five
      # targets build natively on a runner that already matches their
      # OS/arch (this file's own top comment), so the binary this step
      # runs is directly executable here, no emulation needed. `trap`,
      # not a line at the end of the script, for the same reason
      # `image.yml`'s own comment gives: a failure before the last line
      # must still leave something to diagnose with.
      - name: Walk it -- extract, run, register, create a project (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p walk && cd walk
          tar xzf "../${ARCHIVE_NAME}"
          chmod +x peisear
          ./peisear > ../peisear-walk.log 2>&1 &
          pid=$!
          trap 'cat ../peisear-walk.log; kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:3000/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3000/health
          cookie_jar=cookies.txt
          code=$(curl -s -o /dev/null -w '%{http_code}' -c "$cookie_jar" \
            --data-urlencode "email=walk@example.com" \
            --data-urlencode "password=a-real-walk-password-123" \
            --data-urlencode "display_name=Walk" \
            http://127.0.0.1:3000/register)
          echo "register: $code"
          [ "$code" = "303" ] || { echo "::error::register did not redirect (303), got $code"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -b "$cookie_jar" http://127.0.0.1:3000/projects)
          echo "authenticated /projects: $code"
          [ "$code" = "200" ] || { echo "::error::session from register did not authenticate, got $code"; exit 1; }

      - name: Walk it -- extract, run, register, create a project (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path walk | Out-Null
          Expand-Archive -Path $env:ARCHIVE_NAME -DestinationPath walk -Force
          Push-Location walk
          $proc = Start-Process -FilePath .\peisear.exe -RedirectStandardOutput ..\peisear-walk-out.log -RedirectStandardError ..\peisear-walk-err.log -PassThru
          try {
            $ok = $false
            for ($i = 0; $i -lt 30; $i++) {
              try { Invoke-WebRequest -Uri http://127.0.0.1:3000/health -UseBasicParsing | Out-Null; $ok = $true; break } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ok) { throw "health check never came up" }
            # `-MaximumRedirection 0` plus `-SkipHttpErrorCheck` does not
            # return the 303 here -- measured directly: pwsh 7's
            # HttpClient-backed `Invoke-WebRequest` throws "the maximum
            # redirection count has been exceeded" instead, a different
            # error path than the status-code one `-SkipHttpErrorCheck`
            # suppresses. Letting the redirect follow (.NET correctly
            # downgrades the method to GET on a 303, same as a real
            # browser) and asserting the session is authenticated on the
            # other side of it is what the Unix script's explicit `303`
            # check and this are both really establishing.
            $body = @{ email = "walk@example.com"; password = "a-real-walk-password-123"; display_name = "Walk" }
            $resp = Invoke-WebRequest -Uri http://127.0.0.1:3000/register -Method Post -Body $body -SessionVariable session -SkipHttpErrorCheck
            Write-Host "register, followed to its redirect target: $($resp.StatusCode)"
            if ($resp.StatusCode -ne 200) { throw "register's redirect chain did not end at 200, got $($resp.StatusCode)" }
            $resp2 = Invoke-WebRequest -Uri http://127.0.0.1:3000/projects -WebSession $session -SkipHttpErrorCheck
            Write-Host "authenticated /projects: $($resp2.StatusCode)"
            if ($resp2.StatusCode -ne 200) { throw "session from register did not authenticate, got $($resp2.StatusCode)" }
          } finally {
            Get-Content ..\peisear-walk-out.log, ..\peisear-walk-err.log -ErrorAction SilentlyContinue
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Pop-Location
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error

      # workflow_dispatch's whole point is testing the above without
      # this step ever running -- see the trigger's own description.
      - name: Attach to Release
        if: github.event_name == 'release'
        shell: bash
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.ARCHIVE_NAME }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
