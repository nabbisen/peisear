[package]
name        = "peisear-storage"
description = "Persistence layer (SQLite today; designed to grow to PostgreSQL per roadmap)."
readme      = "README.md"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

[dependencies]
peisear-auth                 = { workspace = true }
peisear-core                = { workspace = true }
peisear-i18n                = { workspace = true }

chrono                      = { workspace = true }
sqlx                        = { workspace = true }
thiserror                   = { workspace = true }
tokio                       = { workspace = true }
tracing                     = { workspace = true }
uuid                        = { workspace = true }

# `RFC 018` P2 (`DIA-002`); `§10.48` (`SUP-001`): the dialect seam,
# now forwarding the driver it names rather than only gating the
# `cfg`. `sqlx`'s own `sqlite`/`postgres` features are each driven by
# the matching backend feature here, not declared unconditionally in
# `[workspace.dependencies]` -- a `--features postgres` build no
# longer compiles or links `sqlx-sqlite`/`libsqlite3-sys` at all.
[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
