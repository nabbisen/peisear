[package]
name        = "peisear-web"
description = "Axum + Leptos SSR HTTP layer for peisear (project and issue tracking that also shows how the project is holding up). Library only — the runnable binary lives in the `peisear` facade crate."
readme      = "README.md"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true

# Library only. The runnable binary is owned by the `peisear` facade
# crate so that `cargo install peisear` is the public entry point.
# Integration tests still get to import the router and handlers via
# this lib target.
[lib]
path = "src/lib.rs"

# Mirrors `peisear-storage`'s own pair (`CON-001`, `RFC 018` P4):
# `sqlite`/`postgres` are alternatives, `sqlite` is the default, and
# this crate propagates that choice to every backend-carrying crate
# it depends on directly rather than deciding it again.
[features]
default = ["sqlite"]
sqlite = ["peisear-storage/sqlite", "peisear-notify/sqlite"]
postgres = ["peisear-storage/postgres", "peisear-notify/postgres"]

[dependencies]
peisear-core                = { workspace = true }
peisear-auth                = { workspace = true }
peisear-i18n                = { workspace = true }
peisear-storage             = { workspace = true }
peisear-notify              = { workspace = true }

axum                        = { workspace = true }
axum-extra                  = { workspace = true }
tower                       = { workspace = true }
tower-http                  = { workspace = true }

leptos                      = { workspace = true }
chrono                      = { workspace = true }
time                        = { workspace = true }
validator                   = { workspace = true }

dotenvy                     = { workspace = true }
include_dir                 = { workspace = true }
serde                       = { workspace = true }
serde_json                  = { workspace = true }
serde_urlencoded            = { workspace = true }
thiserror                   = { workspace = true }
tokio                       = { workspace = true }
tracing                     = { workspace = true }
uuid                        = { workspace = true }

[dev-dependencies]
# Integration tests live in `tests/` and use these crates. The
# helper module shared between integration tests is at
# `tests/common/` (each test crate imports it via `mod common;`),
# matching the standard Rust convention for integration test
# submodules. See peisear-feature-spec-v2.1.md §40 (Phase E
# Security QA) for the test categories these dev-deps support.
axum-test                   = { workspace = true }
sqlx                        = { workspace = true }
serde_urlencoded            = { workspace = true }
tempfile                    = { workspace = true }
tracing-subscriber          = { workspace = true }
