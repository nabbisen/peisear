# Workspace manifest.
#
# Versions for every external dependency are pinned here so that member
# crates can inherit them with `{ workspace = true }` and we never have
# accidentally diverging versions across the tree.
#
# See the README for the rationale behind the per-layer split and a
# roadmap-aware view of where future crates (PostgreSQL backend, OIDC
# provider, AI assistant, etc.) are meant to land.

[workspace]
resolver = "2"
members = [
    "crates/peisear-core",
    "crates/peisear-auth",
    "crates/peisear-storage",
    "crates/peisear-notify",
    "crates/peisear-web",
    "crates/peisear",
]

[workspace.package]
version = "0.19.0"
edition = "2024"
rust-version = "1.85"

description = "A minimal, sophisticated, solid, and easy issue tracker."
authors = ["nabbisen <nabbisen@scqr.net>"]
license = "Apache-2.0"
repository = "https://github.com/nabbisen/peisear"
readme = "README.md"
documentation = "https://docs.rs/peisear"

categories = ["web-programming", "command-line-utilities"]
keywords = ["issue-tracker", "kanban", "self-hosted", "leptos", "axum"]

[workspace.dependencies]
# ─── Domain / pure data ──────────────────────────────────────────────
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

# ─── Web / runtime ───────────────────────────────────────────────────
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }

# ─── Testing (dev-only across workspace) ─────────────────────────────
# axum-test wraps a Router and presents an HTTP-like fluent API for
# integration tests. We pick it over reqwest+real-server for two
# reasons: (1) it doesn't bind to a real port, so test parallelism
# isn't bottlenecked on port allocation; (2) it shares the runtime
# with the test, avoiding the spawn-server-and-poll dance.
# Cookie support is built-in (no feature flag) and required because
# peisear authenticates via HTTP-only cookies — tests need to
# exercise the full session lifecycle.
axum-test = "20"

# ─── Storage ─────────────────────────────────────────────────────────
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
    "migrate",
    "chrono",
    "uuid",
] }

# ─── Auth ────────────────────────────────────────────────────────────
jsonwebtoken = "9"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["std"] }

# ─── Web‑layer specifics ─────────────────────────────────────────────
dotenvy = "0.15"
leptos = { version = "0.8", features = ["ssr"] }
serde_json = "1"
serde_urlencoded = "0.7"
time = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.18", features = ["derive"] }

# ─── Notifications / mail transport ─────────────────────────────────
# wasm-smtp 0.9 ships the SMTP protocol core. The `tokio`
# adapter provides a production-quality `Transport` over
# tokio + rustls — peisear's actual deployment shape — so we
# don't write our own transport plumbing. The Cloudflare
# adapter sits in the dependency tree even though we don't
# currently target Workers, so a future Workers deployment is
# a transport swap, not a dependency change.
#
# `mail-builder` is upstream's recommended composition crate
# (see wasm-smtp's `composing-messages.md`). Enabling its
# pass-through feature on wasm-smtp-tokio gives us
# `SmtpClient::send_message`, which takes a
# `mail_builder::MessageBuilder` directly.
wasm-smtp = "0.9"
wasm-smtp-tokio = { version = "0.9", features = ["mail-builder"] }
wasm-smtp-cloudflare = "0.9"
mail-builder = "0.4"

# ─── Workspace‑local crates (consumed via `workspace = true`) ────────
peisear-core = { version = "0.19.0", path = "crates/peisear-core" }
peisear-auth = { version = "0.19.0", path = "crates/peisear-auth" }
peisear-storage = { version = "0.19.0", path = "crates/peisear-storage" }
peisear-notify = { version = "0.19.0", path = "crates/peisear-notify" }
peisear-web = { version = "0.19.0", path = "crates/peisear-web" }

# Release profile applies to all workspace binaries.
[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
codegen-units = 1

[profile.dev]
opt-level = 0
debug = 1
